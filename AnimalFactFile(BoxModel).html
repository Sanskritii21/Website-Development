<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Animal-Name {
            color: rgb(67, 33, 74);
            font-weight: bold;
            text-shadow: 3px 3px rgb(169, 152, 169);
        }

        body {
            background-color: blueviolet;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        .Fact-File {
            width: 250px;
            margin: 27px;
            padding: 25px;
            background-color: wheat;
            border: 5px solid violet;
        }

        .Details {
            color: rgb(124, 83, 124);

        }

        .Cool-Fact {
            color: orange;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="Fact-File">
        <h2 class="Animal-Name">Snow Leopard</h2>
        <p class="Details">Type: Big Cat</p>
        <p class="Details">Lives in: Mountain ranges of Central Asia</p>
        <p class="Details">Diet: Deer, goats, and wild sheep</p>
        <p class="Cool-Fact">Cool Fact: Can leap up to 15 meters in one jump!</p>
    </div>
</body>
</html>
